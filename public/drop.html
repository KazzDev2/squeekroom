<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Burrow Drop</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3efe6; --panel:#fffdf8; --ink:#1d1a14; --muted:#6b645a; --line:#d9d2c3; --squeek:#f5a623; --gold:#c2410c;
  --display:"Silkscreen",ui-monospace,monospace; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15130f; --panel:#1e1b16; --ink:#f1ece2; --muted:#a39b8d; --line:#3a352c; --gold:#ffd166; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15130f; --panel:#1e1b16; --ink:#f1ece2; --muted:#a39b8d; --line:#3a352c; --gold:#ffd166; color-scheme:dark}
/* the page follows the board's look (drop.js sets data-look on <html>) */
:root[data-look="garden"]{--bg:#e0f2fe;--panel:#ffffff;--ink:#1d1a14;--muted:#52606d;--line:#bae6fd;--gold:#b45309;color-scheme:light}
:root[data-look="moonlit"]{--bg:#120f24;--panel:#1e1a3a;--ink:#ede9fe;--muted:#a5a0c8;--line:#2e2a52;--gold:#fde68a;color-scheme:dark}
:root[data-look="cozy"]{--bg:#f3efe6;--panel:#fffdf8;--ink:#1d1a14;--muted:#6b645a;--line:#d9d2c3;--gold:#c2410c;color-scheme:light}
:root[data-look="crystal"]{--bg:#0b1120;--panel:#1e293b;--ink:#e2e8f0;--muted:#94a3b8;--line:#334155;--gold:#fde047;color-scheme:dark}
body{transition:background-color .8s}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--mono);padding:0 16px 24px;min-height:100vh}
main{max-width:520px;margin:0 auto;display:flex;flex-direction:column;align-items:center}
header{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 8px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.5px;margin:0;display:flex;align-items:center;gap:8px}
h1 img{width:30px;height:30px}
.snd{width:34px;height:32px;display:inline-grid;place-items:center;color:var(--ink);background:var(--panel);border:2px solid var(--ink);border-radius:6px;box-shadow:2px 2px 0 var(--ink);cursor:pointer;padding:0}
.snd[data-mode="off"]{opacity:.6}
.hdr-r{display:flex;gap:8px;align-items:center}
.back{font-family:var(--display);font-size:11px;color:var(--ink);text-decoration:none;background:var(--squeek);border:2px solid var(--ink);border-radius:6px;padding:6px 10px;box-shadow:2px 2px 0 var(--ink)}
.stats{width:100%;display:flex;justify-content:space-between;gap:10px;margin:2px 0 8px;font-family:var(--display);font-size:12px;letter-spacing:.3px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;min-width:0}
.stat small{font-size:9px;color:var(--muted);letter-spacing:.4px}
.stat b{font-size:16px;font-weight:700}
.stat.stash b{color:var(--gold)}
.lastb{width:100%;margin:-2px 0 8px;font-size:12px;text-align:right;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lastb[hidden]{display:none}
.lastb b{color:var(--ink)}
.lastb span{color:var(--gold);font-weight:700}
.histbtn,.bhist button{all:unset;cursor:pointer;color:var(--ink);text-decoration:underline dotted;text-underline-offset:2px}
.histbtn{margin-left:6px}
.histbtn:focus-visible,.bhist button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.bhist{list-style:none;width:100%;box-sizing:border-box;margin:-4px 0 8px;padding:6px 8px;max-height:160px;overflow:auto;background:var(--panel);border:2px solid var(--ink);border-radius:6px;font-size:12px}
.bhist[hidden]{display:none}
.bhist li{display:flex;gap:6px;padding:2px 0}
.bhist .a{color:var(--gold);font-weight:700}
.bhist .t{margin-left:auto;color:var(--muted)}
.bhist .more{justify-content:center}
.gold{font-family:var(--display);font-size:10px;color:#1d1a14;background:#ffd166;border:1.5px solid #1d1a14;border-radius:4px;padding:1px 6px;align-self:center}
canvas#board{display:block;width:min(100%, calc((100vh - 190px) * 240 / 360));min-width:240px;aspect-ratio:240/360;height:auto;image-rendering:pixelated;border:3px solid var(--ink);border-radius:8px;box-shadow:4px 4px 0 var(--ink);background:#3d1e0d;touch-action:none;cursor:crosshair}
.wager{width:100%;max-width:360px;display:flex;align-items:center;gap:10px;margin-top:12px}
.wager input[type=range]{flex:1;min-width:0;height:28px;margin:0;accent-color:var(--squeek);cursor:pointer}
.wager input[type=number]{font-family:var(--display);font-size:12px;width:96px;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:6px;padding:6px 8px;text-align:right}
#dropBtn{margin-top:10px;font-family:var(--display);font-size:15px;letter-spacing:.4px;color:#1d1a14;background:var(--squeek);border:2px solid #1d1a14;border-radius:8px;padding:10px 26px;box-shadow:3px 3px 0 #1d1a14;cursor:pointer}
#dropBtn:hover:not(:disabled){background:#ffb84a}
#dropBtn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 #1d1a14}
#dropBtn:disabled{opacity:.55;cursor:default}
</style>
</head>
<body>
<main>
<header>
  <h1><img src="logo.svg" alt="" width="30" height="30">BURROW DROP</h1>
  <span class="hdr-r"><button type="button" class="snd" id="soundBtn"></button><a class="back" href="/">Back to your den</a></span>
</header>
<div class="stats">
  <div class="stat"><small>WATTS</small><b id="watts">…</b></div>
  <span class="gold" id="golden" hidden>GOLDEN BOARD</span>
  <div class="stat stash" style="text-align:right"><small>BOUNTY</small><b id="stash">…</b></div>
</div>
<div class="lastb" id="lastBounty" hidden>Last Bounty: <b id="lastName"></b> <span id="lastAmt"></span> <button type="button" class="histbtn" id="bountyHistBtn">History</button></div>
<ol class="bhist" id="bountyHist" hidden></ol>
<canvas id="board" width="240" height="360" role="img" aria-label="Burrow Drop board"></canvas>
<div class="wager" id="wagerRow" role="group" aria-label="Wager">
  <input id="wagerRange" type="range" min="0" max="1000" step="1" value="0" aria-label="Wager">
  <input id="wagerIn" type="number" inputmode="numeric" min="500" step="1" value="500" aria-label="Wager in Watts">
</div>
<button type="button" id="dropBtn">Drop · 500 W</button>
</main>
<script src="sprites.js"></script>
<script src="sprites_crate.js"></script>
<script src="sprites_drop.js"></script>
<script src="sprites_v5_prizes.js"></script>
<script src="scenes.js"></script>
<script src="sound.js"></script>
<script src="drop_sim.js"></script>
<script src="drop.js"></script>
</body>
</html>
